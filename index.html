<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Naija City 🇳🇬</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #08100c;
    overflow: hidden;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #222;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* TOP HUD */

#hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 76px;
    background: rgba(0,0,0,.72);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 20;
    border-bottom: 1px solid rgba(255,255,255,.12);
}

.stat {
    text-align: center;
}

.stat small {
    display: block;
    color: #a9c7b8;
    font-size: 10px;
    margin-bottom: 4px;
}

.stat strong {
    font-size: 17px;
}

/* MISSION */

#mission {
    position: absolute;
    top: 88px;
    left: 5%;
    right: 5%;
    background: rgba(0,0,0,.78);
    color: white;
    border: 1px solid #20d889;
    border-radius: 14px;
    padding: 12px;
    z-index: 20;
}

#missionTitle {
    color: #20d889;
    font-size: 14px;
    margin-bottom: 5px;
}

#missionText {
    font-size: 13px;
    line-height: 1.4;
}

/* JOYSTICK */

#controls {
    position: absolute;
    left: 20px;
    bottom: 25px;
    width: 155px;
    height: 155px;
    z-index: 30;
}

.control {
    position: absolute;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    border: 1px solid rgba(255,255,255,.2);
    color: white;
    font-size: 23px;
}

.control:active {
    background: rgba(32,216,137,.65);
}

#up {
    top: 0;
    left: 51px;
}

#left {
    top: 51px;
    left: 0;
}

#right {
    top: 51px;
    right: 0;
}

#down {
    bottom: 0;
    left: 51px;
}

/* ACTION BUTTON */

#actionButton {
    position: absolute;
    right: 25px;
    bottom: 75px;
    width: 76px;
    height: 76px;
    border: none;
    border-radius: 50%;
    background: #008753;
    color: white;
    font-weight: bold;
    font-size: 13px;
    z-index: 30;
    box-shadow: 0 8px 25px rgba(0,0,0,.4);
}

#actionButton:active {
    transform: scale(.93);
}

/* MESSAGE */

#message {
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: 18px;
    background: rgba(0,0,0,.88);
    color: white;
    padding: 12px;
    border-radius: 12px;
    text-align: center;
    z-index: 40;
    font-size: 13px;
    transform: translateY(120px);
    transition: transform .3s;
}

#message.show {
    transform: translateY(0);
}

/* START SCREEN */

#startScreen {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at top, #176044, transparent 45%),
        #06100b;
    color: white;
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
}

#startScreen .icon {
    font-size: 75px;
    margin-bottom: 10px;
}

#startScreen h1 {
    font-size: 43px;
    margin-bottom: 10px;
}

.green {
    color: #20d889;
}

#startScreen p {
    color: #b8d7c8;
    max-width: 350px;
    line-height: 1.5;
    margin-bottom: 25px;
}

#startButton {
    width: 85%;
    max-width: 350px;
    padding: 17px;
    border: none;
    border-radius: 15px;
    background: #008753;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* MISSION COMPLETE */

#completeScreen {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 90;
    background:
        radial-gradient(circle at top, #176044, transparent 45%),
        #06100b;
    color: white;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 25px;
}

#completeScreen .big {
    font-size: 75px;
    margin-bottom: 15px;
}

#completeScreen h2 {
    font-size: 34px;
    margin-bottom: 10px;
}

#completeScreen p {
    color: #bdd8cb;
    line-height: 1.5;
    margin-bottom: 20px;
}

#continueButton {
    border: none;
    background: #008753;
    color: white;
    padding: 16px 35px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: bold;
}

/* DESKTOP */

@media (min-width: 700px) {

    #controls {
        left: 35px;
        bottom: 35px;
    }

    #mission {
        left: 25px;
        right: auto;
        width: 330px;
    }

}
</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="stat">
            <small>💰 MONEY</small>
            <strong id="money">₦5,000</strong>
        </div>

        <div class="stat">
            <small>❤️ ENERGY</small>
            <strong id="energy">100</strong>
        </div>

        <div class="stat">
            <small>🏆 SCORE</small>
            <strong id="score">0</strong>
        </div>

    </div>


    <!-- MISSION -->

    <div id="mission">

        <div id="missionTitle">
            🎯 CURRENT MISSION
        </div>

        <div id="missionText">
            Go to the green marker and collect the package.
        </div>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <button class="control" id="up">▲</button>
        <button class="control" id="left">◀</button>
        <button class="control" id="right">▶</button>
        <button class="control" id="down">▼</button>

    </div>


    <button id="actionButton">
        ACTION
    </button>


    <div id="message"></div>


    <!-- START -->

    <div id="startScreen">

        <div class="icon">
            🏙️
        </div>

        <h1>
            NAIJA <span class="green">CITY</span>
        </h1>

        <p>
            Welcome to your city.
            Walk around, explore the streets,
            complete missions and make money.
        </p>

        <button id="startButton">
            🎮 START GAME
        </button>

    </div>


    <!-- MISSION COMPLETE -->

    <div id="completeScreen">

        <div class="big">
            🎉
        </div>

        <h2>
            MISSION COMPLETE!
        </h2>

        <p id="completeText">
            You completed your first mission.
        </p>

        <button id="continueButton">
            CONTINUE
        </button>

    </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   GAME DATA
========================= */

let gameStarted = false;

let money = 5000;

let energy = 100;

let score = 0;


/* =========================
   PLAYER
========================= */

const player = {

    x: 500,

    y: 500,

    size: 24,

    speed: 3.5

};


/* =========================
   CAMERA
========================= */

const camera = {

    x: 0,

    y: 0

};


/* =========================
   WORLD
========================= */

const world = {

    width: 1800,

    height: 1800

};


/* =========================
   MISSION
========================= */

const mission = {

    x: 1350,

    y: 350,

    completed: false

};


/* =========================
   BUILDINGS
========================= */

const buildings = [

    {
        x: 100,
        y: 100,
        w: 220,
        h: 150,
        name: "House"
    },

    {
        x: 400,
        y: 90,
        w: 250,
        h: 170,
        name: "Shop"
    },

    {
        x: 900,
        y: 100,
        w: 300,
        h: 160,
        name: "Apartment"
    },

    {
        x: 1400,
        y: 100,
        w: 250,
        h: 170,
        name: "Hotel"
    },

    {
        x: 80,
        y: 600,
        w: 280,
        h: 190,
        name: "Market"
    },

    {
        x: 500,
        y: 650,
        w: 230,
        h: 170,
        name: "House"
    },

    {
        x: 1000,
        y: 600,
        w: 270,
        h: 190,
        name: "Shop"
    },

    {
        x: 1400,
        y: 650,
        w: 250,
        h: 180,
        name: "House"
    },

    {
        x: 200,
        y: 1100,
        w: 300,
        h: 190,
        name: "Mall"
    },

    {
        x: 700,
        y: 1050,
        w: 280,
        h: 200,
        name: "House"
    },

    {
        x: 1200,
        y: 1100,
        w: 300,
        h: 190,
        name: "Shop"
    },

    {
        x: 1500,
        y: 1100,
        w: 200,
        h: 230,
        name: "House"
    }

];


/* =========================
   ROADS
========================= */

const roads = [

    {
        x: 0,
        y: 350,
        w: 1800,
        h: 120
    },

    {
        x: 0,
        y: 850,
        w: 1800,
        h: 120
    },

    {
        x: 0,
        y: 1350,
        w: 1800,
        h: 120
    },

    {
        x: 350,
        y: 0,
        w: 120,
        h: 1800
    },

    {
        x: 800,
        y: 0,
        w: 120,
        h: 1800
    },

    {
        x: 1300,
        y: 0,
        w: 120,
        h: 1800
    }

];


/* =========================
   CARS
========================= */

const cars = [];

for (let i = 0; i < 8; i++) {

    cars.push({

        x: Math.random() * world.width,

        y:
            [410, 910, 1410]
            [Math.floor(Math.random() * 3)],

        speed:
            1.5 +
            Math.random() * 1.5,

        direction:
            Math.random() > .5
                ? 1
                : -1

    });

}


/* =========================
   PEOPLE
========================= */

const people = [];

for (let i = 0; i < 15; i++) {

    people.push({

        x:
            100 +
            Math.random() *
            1500,

        y:
            100 +
            Math.random() *
            1500,

        direction:
            Math.random() >
            .5
                ? 1
                : -1

    });

}


/* =========================
   CONTROLS
========================= */

const keys = {

    up: false,

    down: false,

    left: false,

    right: false

};


function setupControl(
    id,
    direction
) {

    const button =
        document.getElementById(id);


    button.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            keys[direction] = true;

        }
    );


    button.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            keys[direction] = false;

        }
    );


    button.addEventListener(
        "mousedown",
        function() {

            keys[direction] = true;

        }
    );


    button.addEventListener(
        "mouseup",
        function() {

            keys[direction] = false;

        }
    );


    button.addEventListener(
        "mouseleave",
        function() {

            keys[direction] = false;

        }
    );

}


setupControl("up", "up");

setupControl("down", "down");

setupControl("left", "left");

setupControl("right", "right");


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "ArrowUp" || e.key === "w")
            keys.up = true;

        if (e.key === "ArrowDown" || e.key === "s")
            keys.down = true;

        if (e.key === "ArrowLeft" || e.key === "a")
            keys.left = true;

        if (e.key === "ArrowRight" || e.key === "d")
            keys.right = true;

    }
);


document.addEventListener(
    "keyup",
    function(e) {

        if (e.key === "ArrowUp" || e.key === "w")
            keys.up = false;

        if (e.key === "ArrowDown" || e.key === "s")
            keys.down = false;

        if (e.key === "ArrowLeft" || e.key === "a")
            keys.left = false;

        if (e.key === "ArrowRight" || e.key === "d")
            keys.right = false;

    }
);


/* =========================
   COLLISION
========================= */

function isInsideBuilding(
    x,
    y
) {

    for (const building of buildings) {

        if (
            x > building.x - 15 &&
            x < building.x +
                building.w + 15 &&
            y > building.y - 15 &&
            y < building.y +
                building.h + 15
        ) {

            return true;

        }

    }

    return false;

}


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer() {

    if (!gameStarted) return;


    let newX = player.x;

    let newY = player.y;


    if (keys.up)
        newY -= player.speed;

    if (keys.down)
        newY += player.speed;

    if (keys.left)
        newX -= player.speed;

    if (keys.right)
        newX += player.speed;


    newX =
        Math.max(
            20,
            Math.min(
                world.width - 20,
                newX
            )
        );


    newY =
        Math.max(
            20,
            Math.min(
                world.height - 20,
                newY
            )
        );


    if (
        !isInsideBuilding(
            newX,
            player.y
        )
    ) {

        player.x = newX;

    }


    if (
        !isInsideBuilding(
            player.x,
            newY
        )
    ) {

        player.y = newY;

    }


    if (
        keys.up ||
        keys.down ||
        keys.left ||
        keys.right
    ) {

        energy -= .003;

    }


    checkMission();

}


/* =========================
   CAMERA
========================= */

function updateCamera() {

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;


    camera.x =
        Math.max(
            0,
            Math.min(
                world.width -
                canvas.width,
                camera.x
            )
        );


    camera.y =
        Math.max(
            0,
            Math.min(
                world.height -
                canvas.height,
                camera.y
            )
        );

}


/* =========================
   DRAW WORLD
========================= */

function drawWorld() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.save();

    ctx.translate(
        -camera.x,
        -camera.y
    );


    /* GRASS */

    ctx.fillStyle =
        "#376b43";

    ctx.fillRect(
        0,
        0,
        world.width,
        world.height
    );


    /* ROADS */

    roads.forEach(
        function(road) {

            ctx.fillStyle =
                "#303437";

            ctx.fillRect(
                road.x,
                road.y,
                road.w,
                road.h
            );


            ctx.strokeStyle =
                "#777";

            ctx.lineWidth = 4;

            if (
                road.w >
                road.h
            ) {

                for (
                    let x = road.x + 20;
                    x < road.x + road.w;
                    x += 70
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        x,
                        road.y +
                        road.h / 2
                    );

                    ctx.lineTo(
                        x + 35,
                        road.y +
                        road.h / 2
                    );

                    ctx.stroke();

                }

            } else {

                for (
                    let y = road.y + 20;
                    y < road.y + road.h;
                    y += 70
                ) {

                    ctx.beginPath();

                    ctx.moveTo(
                        road.x +
                        road.w / 2,
                        y
                    );

                    ctx.lineTo(
                        road.x +
                        road.w / 2,
                        y + 35
                    );

                    ctx.stroke();

                }

            }

        }
    );


    /* BUILDINGS */

    buildings.forEach(
        function(building) {

            ctx.fillStyle =
                "#d9d1bd";

            ctx.fillRect(
                building.x,
                building.y,
                building.w,
                building.h
            );


            ctx.strokeStyle =
                "#6b6354";

            ctx.lineWidth = 5;

            ctx.strokeRect(
                building.x,
                building.y,
                building.w,
                building.h
            );


            /* ROOF */

            ctx.fillStyle =
                "#9c3f32";

            ctx.beginPath();

            ctx.moveTo(
                building.x - 8,
                building.y
            );

            ctx.lineTo(
                building.x +
                building.w / 2,
                building.y - 30
            );

            ctx.lineTo(
                building.x +
                building.w + 8,
                building.y
            );

            ctx.closePath();

            ctx.fill();


            /* WINDOWS */

            ctx.fillStyle =
                "#5c9bb4";


            const columns =
                Math.max(
                    2,
                    Math.floor(
                        building.w / 70
                    )
                );


            for (
                let c = 0;
                c < columns;
                c++
            ) {

                for (
                    let r = 0;
                    r < 2;
                    r++
                ) {

                    const wx =
                        building.x +
                        25 +
                        c * 60;

                    const wy =
                        building.y +
                        35 +
                        r * 55;


                    if (
                        wx <
                        building.x +
                        building.w - 20
                    ) {

                        ctx.fillRect(
                            wx,
                            wy,
                            25,
                            30
                        );

                    }

                }

            }


            /* LABEL */

            ctx.fillStyle =
                "rgba(0,0,0,.55)";

            ctx.font =
                "13px Arial";

            ctx.fillText(
                building.name,
                building.x + 10,
                building.y +
                building.h - 10
            );

        }
    );


    /* SHOPS */

    drawShop(
        650,
        380,
        "🍔"
    );

    drawShop(
        1150,
        380,
        "⛽"
    );

    drawShop(
        600,
        880,
        "🏪"
    );


    /* PEOPLE */

    people.forEach(
        function(person) {

            ctx.font = "24px Arial";

            ctx.fillText(
                "🧍🏾",
                person.x,
                person.y
            );

        }
    );


    /* CARS */

    cars.forEach(
        function(car) {

            ctx.font =
                "32px Arial";

            ctx.fillText(
                "🚗",
                car.x,
                car.y
            );

        }
    );


    /* MISSION MARKER */

    if (!mission.completed) {

        const pulse =
            25 +
            Math.sin(
                Date.now() / 200
            ) * 6;


        ctx.beginPath();

        ctx.arc(
            mission.x,
            mission.y,
            pulse,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            "rgba(32,216,137,.25)";

        ctx.fill();


        ctx.font =
            "40px Arial";

        ctx.fillText(
            "📍",
            mission.x - 20,
            mission.y - 30
        );


        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 15px Arial";

        ctx.fillText(
            "PACKAGE",
            mission.x - 34,
            mission.y + 28
        );

    }


    /* PLAYER */

    ctx.font =
        "38px Arial";

    ctx.fillText(
        "🧍🏾",
        player.x - 19,
        player.y + 14
    );


    ctx.restore();

}


/* =========================
   SHOP
========================= */

function drawShop(
    x,
    y,
    icon
) {

    ctx.fillStyle =
        "#efe5c9";

    ctx.fillRect(
        x,
        y,
        130,
        80
    );


    ctx.fillStyle =
        "#cf3d35";

    ctx.fillRect(
        x,
        y,
        130,
        25
    );


    ctx.font =
        "35px Arial";

    ctx.fillText(
        icon,
        x + 48,
        y + 58
    );

}


/* =========================
   CAR MOVEMENT
========================= */

function updateCars() {

    cars.forEach(
        function(car) {

            car.x +=
                car.speed *
                car.direction;


            if (car.x > world.width + 50) {

                car.x = -50;

            }


            if (car.x < -50) {

                car.x =
                    world.width + 50;

            }

        }
    );

}


/* =========================
   MISSION
========================= */

function checkMission() {

    if (mission.completed)
        return;


    const dx =
        player.x -
        mission.x;


    const dy =
        player.y -
        mission.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (distance < 60) {

        mission.completed =
            true;

        money += 2000;

        score += 1000;

        showMissionComplete();

    }

}


/* =========================
   MISSION COMPLETE
========================= */

function showMissionComplete() {

    gameStarted = false;

    document.getElementById(
        "completeText"
    ).textContent =
        "You collected the package and earned ₦2,000!";

    document.getElementById(
        "completeScreen"
    ).style.display =
        "flex";

    updateHUD();

}


/* =========================
   ACTION
========================= */

document.getElementById(
    "actionButton"
).addEventListener(
    "click",
    function() {

        showMessage(
            "🚶 Explore the city and follow the green mission marker."
        );

    }
);


/* =========================
   MESSAGE
========================= */

let messageTimer;

function showMessage(text) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.classList.add("show");


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function() {

                box.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById(
        "money"
    ).textContent =
        "₦" +
        Math.floor(
            money
        ).toLocaleString();


    document.getElementById(
        "energy"
    ).textContent =
        Math.max(
            0,
            Math.floor(
                energy
            )
        );


    document.getElementById(
        "score"
    ).textContent =
        score;

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (gameStarted) {

        movePlayer();

        updateCars();

        updateCamera();

        updateHUD();

    }


    drawWorld();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================
   START GAME
========================= */

document.getElementById(
    "startButton"
).addEventListener(
    "click",
    function() {

        gameStarted = true;

        document.getElementById(
            "startScreen"
        ).style.display =
            "none";


        showMessage(
            "🎯 Follow the green marker. Your first mission is waiting!"
        );

    }
);


/* =========================
   CONTINUE
========================= */

document.getElementById(
    "continueButton"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "completeScreen"
        ).style.display =
            "none";


        mission.completed = false;

        mission.x =
            400 +
            Math.random() * 1200;

        mission.y =
            250 +
            Math.random() * 1200;


        gameStarted = true;


        document.getElementById(
            "missionText"
        ).textContent =
            "New mission: Find the green marker and collect the package.";

        showMessage(
            "🎯 A new mission is waiting!"
        );

    }
);


/* =========================
   START LOOP
========================= */

gameLoop();

</script>

</body>
</html
